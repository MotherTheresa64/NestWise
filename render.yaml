# Repository-side template only. Review plans and region before applying: services incur charges.
projects:
  - name: NestWise
    environments:
      - name: production
        services:
          - type: web
            name: nestwise-api
            runtime: node
            region: oregon
            branch: main
            plan: starter
            numInstances: 1
            autoDeployTrigger: off
            buildCommand: npm ci --include=dev && npm run build:api
            preDeployCommand: npm run db:migrate:production -w @nestwise/api
            startCommand: npm run start -w @nestwise/api
            healthCheckPath: /ready
            maxShutdownDelaySeconds: 30
            envVars:
              - key: NODE_VERSION
                value: 24.19.0
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: TRUST_PROXY_HOPS
                value: "1"
              - key: DATABASE_URL
                fromDatabase:
                  name: nestwise-db
                  property: connectionString
              - key: DATABASE_SSL_MODE
                value: disable
              - key: DATABASE_PRIVATE_NETWORK
                value: "true"
              - key: DATABASE_POOL_MAX
                value: "10"
              - key: CORS_ORIGIN
                sync: false
              - key: APP_WEB_URL
                sync: false
              - key: EMAIL_PROVIDER
                value: disabled
        databases:
          - name: nestwise-db
            databaseName: nestwise
            user: nestwise
            region: oregon
            plan: basic-256mb
            postgresMajorVersion: "18"
            ipAllowList: []
