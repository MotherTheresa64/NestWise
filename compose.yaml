services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nestwise
      POSTGRES_PASSWORD: nestwise_local
      POSTGRES_DB: nestwise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nestwise_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestwise -d nestwise"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nestwise_pg:
