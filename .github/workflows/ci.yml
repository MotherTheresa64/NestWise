name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nestwise
          POSTGRES_PASSWORD: nestwise
          POSTGRES_DB: nestwise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nestwise" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://nestwise:nestwise@127.0.0.1:5432/nestwise_test
